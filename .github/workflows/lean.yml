name: Lean proof check
on:
  push:
    branches: [paper-i-lean-verification, main, paper-i-intrinsic-local, paper-i-local-conservation, paper-i-step2-projective-geometry, paper-i-step2-projective-charts, paper-i-step2-zero-safe-atlas, paper-i-step2-manifold-polar, paper-i-step2-global-tensor, paper-i-step2-tangent-field, paper-i-step2-consolidation-v1.0, paper-i-step3-lorentzian-foundations, paper-i-step3b-connection-uniqueness, paper-i-step3c-chart-compatibility]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean using Elan
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned dependencies and generate manifest
        run: |
          lean --version
          lake update
      - name: Fetch Mathlib compiled dependencies
        run: lake exe cache get
      - name: Build library explicitly
        run: lake build
      - name: Verify and audit theorem dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object Covariance.lean)" = 8481ef5c36f41b016b9fe5d99c9747fea0cbb71e
          test "$(git hash-object Step3A.lean)" = c3ff5a4b4a4f23ee79bfa2342a68d35780fae98e
          test "$(git hash-object Step3B.lean)" = c68a9e0892b80328c265a69d10e2ce3d00ceccef
          test "$(git hash-object STEP2_AXIOM_AUDIT.tsv)" = 039482d1eaae0d6291a31bc582f3b20dafda11cb
          test "$(git hash-object STEP3A_AXIOM_AUDIT.tsv)" = bb169a74488b7b0c92621c2b95657d6a9e08074d
          test "$(git hash-object STEP3B_AXIOM_AUDIT.tsv)" = 8b22fb8748dcd7961442873bd93a6cdf62ac4aa1
          lake env lean Covariance.lean | tee axiom-audit.log
          lake env lean Step3A.lean | tee -a axiom-audit.log
          lake env lean Step3B.lean | tee -a axiom-audit.log
          lake env lean Step3C.lean | tee -a axiom-audit.log
          lake env lean Step3CAtlas.lean | tee -a axiom-audit.log
          lake env lean Step3CManifold.lean | tee -a axiom-audit.log
          lake env lean Step3CSmooth.lean | tee -a axiom-audit.log
          lake env lean Step3CIntrinsic.lean | tee -a axiom-audit.log
          python3 - <<'PY'
          import re
          from pathlib import Path
          source = Path("Covariance.lean").read_text() + "\n" + Path("Step3A.lean").read_text() + "\n" + Path("Step3B.lean").read_text() + "\n" + Path("Step3C.lean").read_text() + "\n" + Path("Step3CAtlas.lean").read_text() + "\n" + Path("Step3CManifold.lean").read_text() + "\n" + Path("Step3CSmooth.lean").read_text() + "\n" + Path("Step3CIntrinsic.lean").read_text()
          out = Path("axiom-audit.log").read_text()
          names = re.findall(r"^#print axioms (MicroMacro\.\w+)$", source, re.M)
          theorems = re.findall(r"^theorem (\w+)", source, re.M)
          definitions = re.findall(r"^(?:noncomputable )?def (\w+)", source, re.M)
          declarations = theorems + definitions
          assert len(theorems) == 247
          assert len(definitions) == 53
          assert len(declarations) == 300
          assert len(names) == len(declarations)
          assert len(set(names)) == len(names)
          assert {x.split(".")[-1] for x in names} == set(declarations)
          allowed = {"propext", "Classical.choice", "Quot.sound"}
          for name in names:
              match = re.search(r"'" + re.escape(name) + r"' depends on axioms: \[([^\]]*)\]", out)
              if match:
                  deps = {x.strip() for x in match.group(1).split(",") if x.strip()}
                  assert deps <= allowed, (name, deps - allowed)
              else:
                  assert "'" + name + "' does not depend on any axioms" in out, name
          import csv
          with Path("STEP2_AXIOM_AUDIT.tsv").open() as f:
              baseline = list(csv.reader(f, delimiter="\t"))[1:]
          assert len(baseline) == 174
          for name, kind, push, pr in baseline:
              match = re.search(r"\x27" + re.escape(name) + r"\x27 depends on axioms: \[([^\]]*)\]", out)
              assert match, name
              actual = ";".join(sorted(x.strip() for x in match.group(1).split(",")))
              assert actual == push == pr, name
          with Path("STEP3A_AXIOM_AUDIT.tsv").open() as f:
              expanded = list(csv.reader(f, delimiter="\t"))[1:]
          assert len(expanded) == 198
          assert len({row[0] for row in expanded}) == 198
          assert {row[0] for row in expanded} == set(re.findall(r"^#print axioms (MicroMacro\.\w+)$", Path("Covariance.lean").read_text() + "\n" + Path("Step3A.lean").read_text(), re.M))
          for module in ("Covariance.lean", "Step3A.lean"):
              module_source = Path(module).read_text()
              module_th = {"MicroMacro." + n for n in re.findall(r"^theorem (\w+)", module_source, re.M)}
              module_def = {"MicroMacro." + n for n in re.findall(r"^(?:noncomputable )?def (\w+)", module_source, re.M)}
              assert {(n, k) for n, k, mod, p, q in expanded if mod == module} == (
                  {(n, "theorem") for n in module_th} | {(n, "definition") for n in module_def})
          for name, kind, module, push, pr in expanded:
              reports = re.findall(r"'" + re.escape(name) + r"' depends on axioms: \[([^\]]*)\]", out)
              assert reports, name
              for report in reports:
                  actual = ";".join(sorted(x.strip() for x in report.split(",") if x.strip()))
                  assert actual == push == pr, name
          print("Expanded permanent ledger matched for all 198 declarations")
          with Path("STEP3B_AXIOM_AUDIT.tsv").open() as f:
              final = list(csv.reader(f, delimiter="\t"))[1:]
          assert len(final) == 217
          assert len({row[0] for row in final}) == 217
          assert {row[0] for row in final} == set(re.findall(r"^#print axioms (MicroMacro\.\w+)$", Path("Covariance.lean").read_text() + "\n" + Path("Step3A.lean").read_text() + "\n" + Path("Step3B.lean").read_text(), re.M))
          for module in ("Covariance.lean", "Step3A.lean", "Step3B.lean"):
              module_source = Path(module).read_text()
              module_th = {"MicroMacro." + n for n in re.findall(r"^theorem (\w+)", module_source, re.M)}
              module_def = {"MicroMacro." + n for n in re.findall(r"^(?:noncomputable )?def (\w+)", module_source, re.M)}
              assert {(n, k) for n, k, mod, p, q in final if mod == module} == (
                  {(n, "theorem") for n in module_th} | {(n, "definition") for n in module_def})
          prior = {n: (k, mod, p, q) for n, k, mod, p, q in expanded}
          current = {n: (k, mod, p, q) for n, k, mod, p, q in final}
          assert all(current[n] == v for n, v in prior.items())
          all_reports = re.findall(r"'(MicroMacro\.\w+)' depends on axioms: \[([^\]]*)\]", out)
          no_axiom = set(re.findall(r"\x27(MicroMacro\.\w+)\x27 does not depend on any axioms", out))
          assert {n for n, _ in all_reports} | no_axiom == set(names)
          assert all({x.strip() for x in report.split(",") if x.strip()} <= allowed for _, report in all_reports)
          assert not ({n for n, _ in all_reports} & no_axiom)
          for name, kind, module, push, pr in final:
              reports = [r for n, r in all_reports if n == name]
              assert reports, name
              for report in reports:
                  actual = ";".join(sorted(x.strip() for x in report.split(",") if x.strip()))
                  assert actual == push == pr, name
          print("Step 3B permanent ledger matched for all 217 declarations")
          assert "sorryAx" not in out
          print("Axiom audit passed for all", len(theorems), "theorems and", len(definitions), "definitions")
          PY
      - name: Record toolchain
        run: |
          lean --version | tee lean-version.log
          lake --version | tee lake-version.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proof-verification
          path: |
            axiom-audit.log
            lean-version.log
            lake-version.log
            lake-manifest.json
